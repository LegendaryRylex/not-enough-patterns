placebo_version=10.0.2
apothic_enchanting_version_range=[2.0.0,)

jei_version=29.47.0.109
jei_version_range=[29.21.0,30)

# dev-run test fixtures only: not compiled against, not shipped, not mod dependencies.
spark_file=8918574

ae2wtlib_version_range=[26.1,27)

# pattern provider integrations; the import card reaches into these mods' providers.
advanced_ae_file=8603081
advanced_ae_version_range=[26.1,)
# runtime-only fixtures for the inherited-support providers and the optional mods' own requirements.
extendedae_file=9129055
extendedae_version_range=[26.1,)
glodium_file=8196173
# regression fixture: AppliedFlux also extends the provider hosts, so it must coexist with nep.
appliedflux_file=9025081
geckolib_file=8327201
ae2addonlib_file=8235116
ae2wtlib_file=9149560
# Thunderbolt was renamed to AE2 Lightning Tech for 26.1, taking a new CurseForge project and the mod id ae2lt.
thunderbolt_file=8121639

# occultism needs modonomicon, smartbrainlib, curios and geckolib; geckolib is already on it.
occultism_file=9126580
occultism_version_range=[1.256.0,)
modonomicon_file=9154399
smartbrainlib_file=9067246
curios_file=8463519

# oritech 2.0 is a beta on CurseForge and needs athena on the client; each oritechthings build only loads against the oritech exp it was built for, so bump the two together.
oritech_file=9163761
oritech_version_range=[2.0.0-exp7,)
oritechthings_file=9165323
oritechthings_version_range=[0.1.2,)
athena_file=7970442

junit_version=5.14.4

mod_id=nep
mod_name=Not Enough Patterns
mod_license=All Rights Reserved
mod_version=0.8.0
mod_group_id=dev.rylex.nep
mod_authors=Rylex
mod_description=Compatibility between Applied Energistics 2 pattern providers and other mods' machines.

# public repo name; only needed because it differs from mod_id
public_repo=not-enough-patterns

# set once the CurseForge project exists; blank disables the upload step in release-mod.ps1
curseforge_project_id=1624304
# optional; defaults to <minecraft_version>,NeoForge,Java 21, so 26.1 has to name Java 25 itself.
# Client and Server are part of the default set and have to be repeated here.
curseforge_game_versions=26.1.2,NeoForge,Java 25,Client,Server
# optional escape hatch when a version name is ambiguous
# curseforge_game_version_ids=
# CurseForge project slugs (last URL segment), mirroring neoforge.mods.toml dependencies
curseforge_required_dependencies=applied-energistics-2
curseforge_optional_dependencies=apothic-enchanting,mystical-agriculture,occultism,oritech,oritech-things,jei,ae2wtlib,advancedae,ex-pattern-provider,guideme-recipe-compat
curseforge_dependency_ids=guideme-recipe-compat:1722328
