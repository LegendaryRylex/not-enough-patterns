modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
logoFile="logo.png"
logoBlur=false

[[mixins]]
config="${mod_id}.mixins.json"

[[mixins]]
config="${mod_id}.advancedae.mixins.json"

[[mixins]]
config="${mod_id}.thunderbolt.mixins.json"

[[dependencies.${mod_id}]]
modId="ae2"
type="required"
versionRange="${ae2_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="apothic_enchanting"
type="optional"
versionRange="${apothic_enchanting_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mysticalagriculture"
type="optional"
versionRange="${mysticalagriculture_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="${jei_version_range}"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="ae2wtlib"
type="optional"
versionRange="${ae2wtlib_version_range}"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="advanced_ae"
type="optional"
versionRange="${advanced_ae_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="extendedae"
type="optional"
versionRange="${extendedae_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="gmrecipes"
type="required"
versionRange="${gmrecipes_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
