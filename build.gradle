plugins {
    id 'idea'
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'com.diffplug.spotless' version '8.8.0'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "$mod_id-$minecraft_version"
}

tasks.named('jar', Jar).configure {
    from 'LICENSE'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.blamejared.com/' }
    maven {
        url = 'https://maven.shadowsoffire.dev/releases'
        content { includeGroup 'dev.shadowsoffire' }
    }
    maven {
        url = 'https://maven.ryanhcode.dev/releases'
        content { includeGroup 'dev.ryanhcode.sable-companion' }
    }
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

// Mod-absence boots: `-Pskip_mods=de,create` drops a family from the run classpath only.
// Untracked `skip_mods.local` supplies the default set when no -Pskip_mods is given;
// `-Pskip_mods=none` forces the full classpath. GameTest, datagen, build, check and test
// invocations ignore the local file so they always see the full dependency set.
var skippableRuntimeMods = [
        de     : [[group: 'curse.maven', module: 'draconic-evolution-223565'],
                  [group: 'curse.maven', module: 'brandons-core-231382'],
                  [group: 'curse.maven', module: 'codechicken-lib-1-8-242818']],
        create : [[group: 'com.simibubi.create'],
                  [group: 'net.createmod.ponder'],
                  [group: 'dev.engine-room.flywheel'],
                  [group: 'com.tterrag.registrate']],
        cna    : [[group: 'curse.maven', module: 'create-new-age-905861']],
        jei    : [[group: 'mezz.jei'],
                  [group: 'curse.maven', module: 'ae2-jei-integration-1074338']],
        emi    : [[group: 'curse.maven', module: 'emi-580555']],
        jade   : [[group: 'curse.maven', module: 'jade-324717']],
        apothic: [[group: 'dev.shadowsoffire']],
        cc     : [[group: 'curse.maven', module: 'compact-crafting-updated-1355698']],
        aa     : [[group: 'curse.maven', module: 'actually-additions-228404'],
                  [group: 'curse.maven', module: 'actually-additions-tiers-1549640']],
        aatiers: [[group: 'curse.maven', module: 'actually-additions-tiers-1549640']],
        ma     : [[group: 'curse.maven', module: 'mystical-agriculture-246640'],
                  [group: 'curse.maven', module: 'cucumber-272335']],
        sable  : [[group: 'curse.maven', module: 'sable-1312371'],
                  [group: 'curse.maven', module: 'create-aeronautics-676721']],
        aae    : [[group: 'curse.maven', module: 'advancedae-1084104'],
                  [group: 'curse.maven', module: 'geckolib-388172'],
                  [group: 'curse.maven', module: 'ae2addonlib-1366135']],
        eae    : [[group: 'curse.maven', module: 'ex-pattern-provider-892005'],
                  [group: 'curse.maven', module: 'glodium-957920']],
        appflux: [[group: 'curse.maven', module: 'applied-flux-965012']],
        expae  : [[group: 'curse.maven', module: 'expanded-ae-1213351']],
        mega   : [[group: 'curse.maven', module: 'mega-cells-622112']],
        ac     : [[group: 'curse.maven', module: 'applied-create-1474758'],
                  [group: 'curse.maven', module: 'kotlin-for-forge-351264']],
        dfa    : [[group: 'curse.maven', module: 'ae2-draconic-fusion-autocrafter-1521464']],
        wtlib  : [[group: 'curse.maven', module: 'ae2wtlib-459929']],
        tb     : [[group: 'curse.maven', module: 'thunderbolt-1631756']],
]

var impliedSkips = [
        create: ['sable', 'ac', 'cna'],
        de    : ['dfa'],
        wtlib : ['aae', 'eae', 'appflux', 'expae'],
        eae   : ['appflux'],
]

var skipModsLocal = file('skip_mods.local')
var fullClasspathRequested = gradle.startParameter.taskNames.any {
    var t = it.toLowerCase()
    t.contains('gametest') || t.contains('rundata') || t.endsWith('build') || t.endsWith('check') || t.endsWith('test')
}
var skipModsRequest = ''
if (project.hasProperty('skip_mods')) {
    skipModsRequest = project.skip_mods.toString()
} else if (skipModsLocal.exists() && !fullClasspathRequested) {
    skipModsRequest = skipModsLocal.text
}
var skippedMods = skipModsRequest.split(',')*.trim().findAll { it }*.toLowerCase() - ['none']
var unknownSkips = skippedMods.findAll { !skippableRuntimeMods.containsKey(it) }
if (unknownSkips) {
    throw new GradleException("unknown skip_mods entries ${unknownSkips.join(', ')}; known: ${skippableRuntimeMods.keySet().join(', ')}")
}
skippedMods = (skippedMods + skippedMods.collectMany { impliedSkips[it] ?: [] }).unique()
if (skippedMods) {
    skippedMods.each { key -> skippableRuntimeMods[key].each { configurations.runtimeClasspath.exclude(it) } }
    logger.lifecycle("run classpath is missing: ${skippedMods.join(', ')}")
} else if (skipModsLocal.exists() && fullClasspathRequested) {
    logger.lifecycle("skip_mods.local ignored: requested tasks run the full classpath")
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (!skippedMods) {
                systemProperty 'guideme.ae2.guide.sources', file('src/main/resources/assets/nep/ae2guide').absolutePath
                systemProperty 'guideme.ae2.guide.sourcesNamespace', project.mod_id
            }
        }

        clientAlt {
            client()
            programArguments.addAll '--username', 'Dev2'
            if (!skippedMods) {
                systemProperty 'guideme.ae2.guide.sources', file('src/main/resources/assets/nep/ae2guide').absolutePath
                systemProperty 'guideme.ae2.guide.sourcesNamespace', project.mod_id
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        serverAlt {
            server()
            programArguments.addAll '--nogui', '--port', '25566'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            gameDirectory = file("runs/$name")
            jvmArgument '-Xmx8G'
            jvmArgument '-XX:MaxDirectMemorySize=2G'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // Never in `jar`, and not on skip_mods boots: the GameTest scanner reflects over
            // test signatures that may name classes from the skipped mod.
            if (!skippedMods) {
                sourceSet(sourceSets.gametest)
            }
        }
    }

    addModdingDependenciesTo(sourceSets.gametest)

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
    compactCraftingJar
}

// Compact Crafting ships its API as a jar-in-jar; unpack it for the compile classpath.
var compactCraftingApiDir = layout.buildDirectory.dir('compactcrafting-api').get().asFile

var extractCompactCraftingApi = tasks.register('extractCompactCraftingApi', Sync) {
    var jars = configurations.compactCraftingJar
    from({ jars.collect { zipTree(it) } }) {
        include 'META-INF/jarjar/*-api-*.jar'
        eachFile { it.relativePath = new RelativePath(true, it.name) }
    }
    includeEmptyDirs = false
    into compactCraftingApiDir
}

dependencies {
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    compileOnly "org.appliedenergistics:guideme:${guideme_version}"

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"

    compileOnly "curse.maven:create-new-age-905861:${create_new_age_file}"
    localRuntime "curse.maven:create-new-age-905861:${create_new_age_file}"

    compileOnly "curse.maven:ae2wtlib-459929:${ae2wtlib_file}"
    localRuntime "curse.maven:ae2wtlib-459929:${ae2wtlib_file}"

    compileOnly "curse.maven:thunderbolt-1631756:${thunderbolt_file}"
    localRuntime "curse.maven:thunderbolt-1631756:${thunderbolt_file}"

    compileOnly "curse.maven:advancedae-1084104:${advanced_ae_file}"
    localRuntime "curse.maven:advancedae-1084104:${advanced_ae_file}"
    localRuntime "curse.maven:geckolib-388172:${geckolib_file}"
    localRuntime "curse.maven:ae2addonlib-1366135:${ae2addonlib_file}"

    localRuntime "curse.maven:ae2-draconic-fusion-autocrafter-1521464:${ae2_draconic_fusion_autocrafter_file}"
    localRuntime "curse.maven:ex-pattern-provider-892005:${extendedae_file}"
    localRuntime "curse.maven:glodium-957920:${glodium_file}"
    localRuntime "curse.maven:applied-flux-965012:${appliedflux_file}"
    localRuntime "curse.maven:expanded-ae-1213351:${expandedae_file}"
    localRuntime "curse.maven:mega-cells-622112:${megacells_file}"
    localRuntime "curse.maven:applied-create-1474758:${appliedcreate_file}"
    localRuntime "curse.maven:kotlin-for-forge-351264:${kotlinforforge_file}"

    compileOnly "curse.maven:draconic-evolution-223565:${draconic_evolution_file}"
    compileOnly "curse.maven:brandons-core-231382:${brandonscore_file}"
    compileOnly "curse.maven:codechicken-lib-1-8-242818:${codechickenlib_file}"
    localRuntime "curse.maven:draconic-evolution-223565:${draconic_evolution_file}"
    localRuntime "curse.maven:brandons-core-231382:${brandonscore_file}"
    localRuntime "curse.maven:codechicken-lib-1-8-242818:${codechickenlib_file}"

    compileOnly "curse.maven:compact-crafting-updated-1355698:${compact_crafting_file}"
    localRuntime "curse.maven:compact-crafting-updated-1355698:${compact_crafting_file}"
    compactCraftingJar "curse.maven:compact-crafting-updated-1355698:${compact_crafting_file}"
    compileOnly fileTree(dir: compactCraftingApiDir, include: '*.jar').builtBy(extractCompactCraftingApi)

    compileOnly "curse.maven:actually-additions-228404:${actually_additions_file}"
    compileOnly "curse.maven:actually-additions-tiers-1549640:${actually_additions_tiers_file}"
    localRuntime "curse.maven:actually-additions-228404:${actually_additions_file}"
    localRuntime "curse.maven:actually-additions-tiers-1549640:${actually_additions_tiers_file}"

    compileOnly "curse.maven:mystical-agriculture-246640:${mysticalagriculture_file}"
    compileOnly "curse.maven:cucumber-272335:${cucumber_file}"
    localRuntime "curse.maven:mystical-agriculture-246640:${mysticalagriculture_file}"
    localRuntime "curse.maven:cucumber-272335:${cucumber_file}"

    // transitive = false: their poms pull in Curios from a maven we do not carry
    compileOnly("dev.shadowsoffire:ApothicEnchanting:${minecraft_version}-${apothic_enchanting_version}") { transitive = false }
    compileOnly("dev.shadowsoffire:ApothicAttributes:${minecraft_version}-${apothic_attributes_version}") { transitive = false }
    compileOnly("dev.shadowsoffire:Placebo:${minecraft_version}-${placebo_version}") { transitive = false }
    localRuntime("dev.shadowsoffire:ApothicEnchanting:${minecraft_version}-${apothic_enchanting_version}") { transitive = false }
    localRuntime("dev.shadowsoffire:ApothicAttributes:${minecraft_version}-${apothic_attributes_version}") { transitive = false }
    localRuntime("dev.shadowsoffire:Placebo:${minecraft_version}-${placebo_version}") { transitive = false }

    localRuntime "curse.maven:ae2-jei-integration-1074338:7727898"
    localRuntime "curse.maven:architectury-api-419699:8492726"
    localRuntime "curse.maven:tool-kit-324888:8216546"

    localRuntime "curse.maven:functional-storage-556861:${functionalstorage_file}"
    localRuntime "curse.maven:titanium-287342:${titanium_file}"
    localRuntime "curse.maven:spark-361579:${spark_file}"

    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    compileOnly "curse.maven:emi-580555:${emi_file}"
    localRuntime "curse.maven:emi-580555:${emi_file}"

    compileOnly "curse.maven:jade-324717:7545219"
    localRuntime "curse.maven:jade-324717:7545219"

    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"
    localRuntime "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"

    localRuntime "curse.maven:sable-1312371:${sable_file}"
    localRuntime "curse.maven:create-aeronautics-676721:${aeronautics_file}"

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'nep.projectDir', projectDir.absolutePath
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        importOrder()
        removeUnusedImports()
        palantirJavaFormat()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            ae2_version_range      : ae2_version_range,
            create_version_range   : create_version_range,
            create_new_age_version_range: create_new_age_version_range,
            jei_version_range      : jei_version_range,
            emi_version_range      : emi_version_range,
            ae2wtlib_version_range : ae2wtlib_version_range,
            advanced_ae_version_range: advanced_ae_version_range,
            extendedae_version_range: extendedae_version_range,
            expandedae_version_range: expandedae_version_range,
            megacells_version_range: megacells_version_range,
            draconic_evolution_version_range: draconic_evolution_version_range,
            compact_crafting_version_range: compact_crafting_version_range,
            actually_additions_version_range: actually_additions_version_range,
            mysticalagriculture_version_range: mysticalagriculture_version_range,
            jade_version_range     : jade_version_range,
            sable_version_range    : sable_version_range,
            apothic_enchanting_version_range: apothic_enchanting_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishMods {
    file = jar.archiveFile
    def changelogFile = file("changelogs/${mod_version}.md")
    changelog = changelogFile.exists() ? changelogFile.text : "Release ${version}"
    displayName = "${mod_name} ${mod_version}"
    type = STABLE
    modLoaders.add("neoforge")
    dryRun = providers.gradleProperty('publish_dry_run').present

    curseforge {
        projectId = curseforge_project_id
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        clientRequired = true
        serverRequired = true
        var required = curseforge_required_dependencies.split(',')*.trim().findAll { it }
        var optionalDependencies = curseforge_optional_dependencies.split(',')*.trim().findAll { it }
        if (required) {
            requires(*required)
        }
        if (optionalDependencies) {
            optional(*optionalDependencies)
        }
    }
}

tasks.named('publishMods') {
    dependsOn 'check'
}

tasks.named('publishCurseforge') {
    dependsOn 'check'
}
